<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daystat - GKE Prober Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daystat Dashboard</h1>
            <div id="region-display" style="font-size: 1rem; color: rgba(255, 255, 255, 0.6); margin-top: -0.5rem; margin-bottom: 1rem;">Region: Loading...</div>
            <div id="connection-status" class="status-indicator connected">Connected</div>
        </header>
        
        <main>
            <div class="glass-panel">
                <div class="grid-container" id="status-grid">
                    <!-- Grid will be generated here -->
                    <div class="loading">Loading grid data...</div>
                </div>
            </div>
        </main>

        <footer>
            <p>Daystat Operations Monitor</p>
        </footer>
    </div>

    <!-- Popover Container -->
    <div id="popover" class="popover hidden">
        <div class="popover-content">
            <span class="close-btn">&times;</span>
            <h3 id="popover-title">Step Details</h3>
            <div id="popover-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
